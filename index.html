<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbf4e2">
<title>Countryside Escape Tycoon – visual sample</title>
<!--
  Countryside Escape Tycoon – representative gameplay screen (art-direction sample).
  All artwork is original vector art drawn in code below (canvas + inline SVG). No external assets.
  Performance notes (target: iPhone 11 / iOS 16+ Safari): static scenery is pre-rendered once to
  off-screen canvases; only trees, clouds, guests and effects are redrawn each frame. No CSS filters,
  no blur, device pixel ratio capped at 2.
-->
<style>
:root{
  --cream:#fbf4e2; --cream2:#f4e9cf; --card:#fffaf0; --ink:#3b3226; --ink2:#7a6a52;
  --teal:#2a7f7a; --teal-d:#1f615d; --teal-l:#d9eeea; --red:#c4533d; --red-l:#f8e1da;
  --gold:#e3a72f; --line:#e4d4ad;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#7fb35f;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Avenir Next",-apple-system,system-ui,"Segoe UI",sans-serif;
  touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block}

/* ---------- top bar ---------- */
#top{position:fixed;left:8px;right:8px;top:calc(var(--sat) + 8px);max-width:560px;margin:0 auto;
  background:var(--cream);border-radius:18px;padding:8px 10px 9px;
  box-shadow:0 3px 0 var(--line),0 6px 14px rgba(60,45,20,.18)}
.row{display:flex;align-items:center;gap:6px}
.money{font-weight:800;font-size:23px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px;transition:color .2s}
.money.flash{color:var(--red)}
.money.gain{color:var(--teal)}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:5px;background:var(--cream2);border-radius:999px;padding:5px 10px 5px 7px;font-weight:700;font-size:14px;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:12px;background:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--teal-d)}
.stats{margin-top:7px;gap:6px}
.stat{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;height:34px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.stat small{font-weight:600;color:var(--ink2);font-size:12px}
.hbar{width:30px;height:7px;border-radius:4px;background:#e9dfc6;overflow:hidden}
.hbar i{display:block;height:100%;background:#6ab04c;border-radius:4px}
.stars{display:flex;gap:1px}
#goal{position:fixed;left:16px;top:0;max-width:calc(100% - 32px);background:rgba(251,244,226,.92);border-radius:999px;padding:4px 11px 4px 8px;
  font-size:12.5px;font-weight:700;color:var(--teal-d);display:flex;align-items:center;gap:5px;box-shadow:0 2px 6px rgba(60,45,20,.15);white-space:nowrap}
#paused{position:fixed;right:16px;top:0;background:var(--ink);color:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:800;display:none;letter-spacing:.5px}

/* ---------- build toolbar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--cream);
  border-radius:22px 22px 0 0;padding:9px 8px calc(var(--sab) + 10px);box-shadow:0 -3px 0 var(--line),0 -6px 16px rgba(60,45,20,.16)}
.head{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
#hint{flex:1;font-size:14px;font-weight:700;color:var(--ink2);line-height:1.2;min-height:34px;display:flex;align-items:center}
#hint b{color:var(--teal-d)}
#cancel{display:none;height:34px;padding:0 12px;border-radius:11px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:14px;color:var(--ink2)}
.speed{display:flex;background:var(--cream2);border-radius:12px;padding:3px;gap:2px}
.speed button{width:44px;height:34px;border-radius:9px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.speed button.on{background:var(--teal);color:#fff;box-shadow:0 2px 0 var(--teal-d)}
.builds{display:flex;gap:6px}
.b{flex:1;min-width:0;height:100px;border-radius:15px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px 6px;transition:transform .08s}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.b canvas{width:60px;height:44px;display:block}
.b .nm{font-size:12px;font-weight:800;line-height:1.05;text-align:center;height:26px;display:flex;align-items:center}
.b .pr{font-size:13px;font-weight:800;color:var(--teal-d);background:var(--teal-l);border-radius:999px;padding:1px 8px}
.b.sel{border-color:var(--teal);background:#eef8f5;box-shadow:0 3px 0 var(--teal-d)}
.b.poor .pr{color:var(--red);background:var(--red-l)}
.b.poor canvas{opacity:.55}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:0;transform:translate(-50%,10px);width:max-content;max-width:calc(100% - 28px);
  background:var(--ink);color:#fff8ea;border-radius:16px;padding:10px 14px;font-size:14.5px;font-weight:700;line-height:1.3;
  display:flex;gap:9px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 16px rgba(30,20,10,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .ti{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
#toast.warn .ti{background:#f2b84b;color:var(--ink)}
#toast.ok .ti{background:#6ab04c;color:#fff}
#toast.info .ti{background:var(--teal);color:#fff}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
  <div class="row">
    <div class="money" id="money">
      <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#e3a72f"/><circle cx="12" cy="12" r="7.6" fill="#f4c95d"/><path d="M14.6 8.4c-.5-.6-1.3-.9-2.1-.9-1.5 0-2.4 1-2.4 2.4v4.8M8.6 12h4.4M8.4 16.1h7" stroke="#a8721a" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
      <span id="moneyTxt">£1,250</span>
    </div>
    <div class="spacer"></div>
    <div class="pill">
      <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.2" fill="#f2b84b"/><g stroke="#f2b84b" stroke-width="1.8" stroke-linecap="round"><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></g></svg>
      <span id="clock">Day 1 · 08:00</span>
    </div>
    <button class="iconbtn" id="menu" aria-label="Menu">
      <svg width="18" height="16" viewBox="0 0 18 16"><path d="M2 2.5h14M2 8h14M2 13.5h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="row stats">
    <div class="stat" id="stGuests">
      <svg width="22" height="18" viewBox="0 0 22 18"><circle cx="7" cy="5" r="3.2" fill="#2a7f7a"/><path d="M1.5 16.5c0-3.6 2.5-6 5.5-6s5.5 2.4 5.5 6z" fill="#2a7f7a"/><circle cx="15.5" cy="6.5" r="2.6" fill="#7fb7b1"/><path d="M11.6 16.5c.2-3 2-5 4-5s4.6 2 4.6 5z" fill="#7fb7b1"/></svg>
      <span id="guests">12</span><small>guests</small>
    </div>
    <div class="stat">
      <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="#f4c95d" stroke="#d99a2b" stroke-width="1.4"/><circle cx="7.2" cy="8.2" r="1.2" fill="#5a4320"/><circle cx="12.8" cy="8.2" r="1.2" fill="#5a4320"/><path d="M6.4 11.6c1.8 2.4 5.4 2.4 7.2 0" stroke="#5a4320" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      <span id="happy">78%</span><div class="hbar"><i id="happyBar" style="width:78%"></i></div>
    </div>
    <div class="stat"><div class="stars" id="stars"></div></div>
  </div>
</div>
<div id="goal">
  <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 15V1.5" stroke="#6d4c2f" stroke-width="1.8" stroke-linecap="round"/><path d="M3.6 2h9l-2.2 3 2.2 3h-9z" fill="#2a7f7a"/></svg>
  Goal: 25 guests · 80% happy · in profit
</div>
<div id="paused">PAUSED</div>

<div id="bar">
  <div class="head">
    <div id="hint">Pick something to build, then tap the grass.</div>
    <button id="cancel">Cancel</button>
    <div class="speed" id="speed">
      <button data-s="0" aria-label="Pause"><svg width="14" height="16" viewBox="0 0 14 16"><rect x="1" y="1" width="4.2" height="14" rx="1.6" fill="currentColor"/><rect x="8.8" y="1" width="4.2" height="14" rx="1.6" fill="currentColor"/></svg></button>
      <button data-s="1" class="on">1×</button>
      <button data-s="2">2×</button>
    </div>
  </div>
  <div class="builds" id="builds"></div>
</div>
<div id="toast"><div class="ti">!</div><div id="toastTxt"></div></div>

<script>
(function(){
'use strict';
/* ================= data ================= */
var COLS = 7, ROWS = 9, BS = 1.2, PS = 1.3; // BS/PS: building & person scale relative to a tile
var TYPES = {
  tent:      {name:'Tent pitch', label:'Tent pitch', cost:150, info:'Cheap and cheerful – walkers love a pitch.'},
  cabin:     {name:'Cabin', label:'Cabin', cost:600, info:'A cosy timber cabin. Couples pay extra for comfort.'},
  toilets:   {name:'Toilets & Showers', label:'Toilets &amp; Showers', cost:400, info:'Guests get grumpy if these are too far away.'},
  reception: {name:'Reception', label:'Reception', cost:800, info:'Guests check in here. Busy sites need more than one.'},
  shop:      {name:'Shop', label:'Shop', cost:500, info:'Snacks, milk and firewood – a little extra income.'}
};
var ORDER = ['tent','cabin','toilets','reception','shop'];
// winding footpath, in tile units (col,row), from the gate (bottom) up into the woods (top)
var PATH_CTRL = [[3.5,10.2],[3.5,8.6],[3.2,7.5],[2.5,6.6],[2.1,5.5],[2.4,4.3],[3.3,3.6],[4.3,3.0],[4.6,1.9],[4.4,0.8],[4.5,-1.2]];
var PATH = []; // tiles the path crosses – computed from the curve

var state = {
  money:1250, day:1, minutes:8*60, speed:1, guests:12, happiness:78, rep:3.5,
  selected:null, ghost:null,
  buildings:[
    {type:'reception', c:4, r:7},
    {type:'toilets',   c:1, r:5},
    {type:'tent', c:1, r:3, v:0},
    {type:'tent', c:3, r:2, v:1},
    {type:'tent', c:5, r:1, v:2}
  ],
  trees:[{c:0,r:0,s:1.15,p:0.3},{c:6,r:5,s:1.05,p:1.7},{c:0,r:8,s:1.0,p:2.6},{c:6,r:0,s:0.95,p:4.1}],
  decor:[{type:'campfire', c:0, r:3}]
};

/* ================= helpers ================= */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function poly(g,p){ g.beginPath(); g.moveTo(p[0],p[1]); for(var i=2;i<p.length;i+=2) g.lineTo(p[i],p[i+1]); g.closePath(); }
function ell(g,x,y,rx,ry){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); }
var INK='rgba(59,46,30,.6)';
function ink(g,u,w){ g.lineWidth=(w||1)*u; g.strokeStyle=INK; g.lineJoin='round'; g.stroke(); }
function shadow(g,x,y,rx,ry){ g.fillStyle='rgba(38,62,22,.22)'; ell(g,x,y,rx,ry); g.fill(); }
function fmt(n){ return '£'+Math.round(n).toLocaleString('en-GB'); }
function key(c,r){ return c+','+r; }

/* ================= art: buildings ================= */
// each draw fn: (g, cx, by, u, t, o) – cx = centre x, by = ground line, u = scale unit (1 ≈ 52px tile)
var TENT_COLS=[['#3a9a91','#2c7f78','#1d5450'],['#e8964f','#c9763a','#7a4220'],['#e4bb4f','#c79a35','#7a5a1c']];
function drawTent(g,cx,by,u,t,o){
  var v=TENT_COLS[(o&&o.v)||0];
  // worn pitch patch
  g.fillStyle='rgba(205,225,150,.55)'; rr(g,cx-21*u,by-17*u,42*u,19*u,5*u); g.fill();
  g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=1*u; g.setLineDash([3*u,3*u]); g.stroke(); g.setLineDash([]);
  shadow(g,cx+3*u,by-1*u,17*u,4*u);
  var L=[cx-15*u,by-2*u], R=[cx+13*u,by-2*u], A=[cx-1*u,by-25*u], B=[cx+5*u,by-31*u], BR=[cx+19*u,by-9*u];
  // side panel (going back)
  g.fillStyle=v[1]; poly(g,[R[0],R[1],A[0],A[1],B[0],B[1],BR[0],BR[1]]); g.fill(); ink(g,u);
  // front face
  g.fillStyle=v[0]; poly(g,[L[0],L[1],A[0],A[1],R[0],R[1]]); g.fill(); ink(g,u);
  // door
  g.fillStyle=v[2]; poly(g,[cx-7*u,by-2*u,cx-1*u,by-17*u,cx+5*u,by-2*u]); g.fill();
  g.fillStyle=v[0]; poly(g,[cx-1*u,by-17*u,cx+5*u,by-2*u,cx+1.5*u,by-2*u]); g.fill();
  // guy ropes + pegs
  g.strokeStyle='rgba(80,60,40,.55)'; g.lineWidth=0.8*u; g.beginPath();
  g.moveTo(A[0],A[1]); g.lineTo(cx-20*u,by-5*u); g.moveTo(B[0],B[1]); g.lineTo(cx+21*u,by-15*u); g.stroke();
  g.fillStyle='#6b4a2f'; g.fillRect(cx-21*u,by-6*u,1.6*u,2.4*u); g.fillRect(cx+20.5*u,by-16*u,1.6*u,2.4*u);
}
function logWall(g,x,y,w,h,u,col,dark){
  g.fillStyle=col; g.fillRect(x,y,w,h);
  g.strokeStyle=dark; g.lineWidth=0.9*u; g.beginPath();
  for(var yy=y+3.6*u; yy<y+h-0.5*u; yy+=3.6*u){ g.moveTo(x,yy); g.lineTo(x+w,yy); } g.stroke();
  g.fillStyle='#c99260'; // log ends
  for(var y2=y+1.8*u; y2<y+h; y2+=3.6*u){ ell(g,x,y2,1.6*u,1.6*u); g.fill(); ell(g,x+w,y2,1.6*u,1.6*u); g.fill(); }
  g.beginPath(); g.rect(x,y,w,h); ink(g,u);
}
function shingleRoof(g,pts,u,col,line,rows){
  g.fillStyle=col; poly(g,pts); g.fill();
  g.save(); poly(g,pts); g.clip(); g.strokeStyle=line; g.lineWidth=0.9*u; g.beginPath();
  var top=Math.min(pts[1],pts[3],pts[5],pts[7]), bot=Math.max(pts[1],pts[3],pts[5],pts[7]);
  for(var i=1;i<rows;i++){ var yy=top+(bot-top)*i/rows; g.moveTo(pts[0]-20*u,yy); g.lineTo(pts[2]+20*u,yy); }
  g.stroke(); g.restore(); poly(g,pts); ink(g,u);
}
function warmWindow(g,x,y,w,h,u){
  g.fillStyle='#ffd987'; g.fillRect(x,y,w,h); g.fillStyle='rgba(255,246,210,.8)'; g.fillRect(x+0.8*u,y+0.8*u,w*0.35,h*0.4);
  g.strokeStyle='#6b3f22'; g.lineWidth=1.1*u; g.beginPath(); g.moveTo(x+w/2,y); g.lineTo(x+w/2,y+h); g.moveTo(x,y+h/2); g.lineTo(x+w,y+h/2); g.stroke();
  g.beginPath(); g.rect(x,y,w,h); ink(g,u,1.1);
}
function flowers(g,x,y,w,u){
  g.fillStyle='#7a4a28'; g.fillRect(x,y,w,2.6*u);
  var c=['#e0607e','#f6d65b','#ffffff','#e0607e'];
  for(var i=0;i<4;i++){ g.fillStyle='#4f8a3f'; ell(g,x+(i+0.5)*w/4,y-0.4*u,1.6*u,1.2*u); g.fill(); g.fillStyle=c[i]; ell(g,x+(i+0.5)*w/4,y-0.9*u,0.9*u,0.9*u); g.fill(); }
}
function smoke(g,x,y,u,t){
  for(var i=0;i<3;i++){ var k=((t*0.35+i/3)%1); g.fillStyle='rgba(240,240,235,'+(0.55*(1-k))+')'; ell(g,x+Math.sin(k*4+i)*2.5*u+k*5*u,y-k*16*u,(1.6+k*2.6)*u,(1.6+k*2.6)*u); g.fill(); }
}
function drawCabin(g,cx,by,u,t){
  shadow(g,cx+2*u,by,22*u,4.5*u);
  // chimney
  g.fillStyle='#9b968a'; g.fillRect(cx+9*u,by-38*u,5*u,9*u); g.beginPath(); g.rect(cx+9*u,by-38*u,5*u,9*u); ink(g,u);
  if(t) smoke(g,cx+11.5*u,by-40*u,u,t);
  logWall(g,cx-17*u,by-19*u,34*u,19*u,u,'#a76a3a','#7d4b26');
  shingleRoof(g,[cx-22*u,by-17*u,cx+22*u,by-17*u,cx+17*u,by-34*u,cx-17*u,by-34*u],u,'#5d7a57','#4a6346',4);
  g.fillStyle='#45603f'; g.fillRect(cx-17*u,by-35.5*u,34*u,2.4*u);
  // door + window
  g.fillStyle='#6b3f22'; g.fillRect(cx-12*u,by-13*u,8*u,13*u); g.beginPath(); g.rect(cx-12*u,by-13*u,8*u,13*u); ink(g,u);
  g.fillStyle='#e3b04b'; ell(g,cx-5.6*u,by-6.5*u,0.8*u,0.8*u); g.fill();
  warmWindow(g,cx+2*u,by-13*u,9*u,7*u,u); flowers(g,cx+1.5*u,by-5.5*u,10*u,u);
  g.fillStyle='#8a5a33'; g.fillRect(cx-14*u,by-1*u,12*u,2*u);
}
function drawToilets(g,cx,by,u){
  shadow(g,cx+2*u,by,22*u,4.5*u);
  // stone walls
  g.fillStyle='#e9e1cd'; g.fillRect(cx-18*u,by-18*u,36*u,18*u);
  g.strokeStyle='rgba(140,125,100,.45)'; g.lineWidth=0.8*u; g.beginPath();
  for(var r=0;r<4;r++){ var yy=by-18*u+r*4.5*u; g.moveTo(cx-18*u,yy); g.lineTo(cx+18*u,yy);
    for(var x=cx-18*u+(r%2?3:6)*u; x<cx+18*u; x+=7*u){ g.moveTo(x,yy); g.lineTo(x,yy+4.5*u);} }
  g.stroke(); g.beginPath(); g.rect(cx-18*u,by-18*u,36*u,18*u); ink(g,u);
  shingleRoof(g,[cx-21*u,by-16*u,cx+21*u,by-16*u,cx+16*u,by-30*u,cx-16*u,by-30*u],u,'#66707b','#525b65',3);
  // doors
  [[-13,'#2a7f7a'],[3,'#2a7f7a']].forEach(function(d){ var x=cx+d[0]*u;
    g.fillStyle=d[1]; g.fillRect(x,by-13*u,9*u,13*u); g.beginPath(); g.rect(x,by-13*u,9*u,13*u); ink(g,u); });
  // little signs
  g.fillStyle='#fff'; ell(g,cx-8.5*u,by-10*u,1.2*u,1.2*u); g.fill(); g.fillRect(cx-9.6*u,by-8.6*u,2.2*u,3.6*u);
  ell(g,cx+7.5*u,by-10*u,1.2*u,1.2*u); g.fill(); poly(g,[cx+7.5*u,by-8.8*u,cx+5.8*u,by-5*u,cx+9.2*u,by-5*u]); g.fill();
  // shower head sign + tap
  g.fillStyle='#fbf4e2'; rr(g,cx-4*u,by-27*u,8*u,5.5*u,1.2*u); g.fill(); ink(g,u,0.8);

  g.save(); g.beginPath(); g.rect(x1,base-h*1.6,x2-x1,h*1.7); g.clip();
  g.fillStyle='#5e594f'; g.fillRect(x1,base-h,x2-x1,h);
  var rows=3, rh=h/rows;
  for(var r=0;r<rows;r++){ var x=x1-R()*8*u, y=base-(r+1)*rh;
    while(x<x2){ var w=(5+R()*8)*u; g.fillStyle=STONES[Math.floor(R()*STONES.length)]; rr(g,x+0.6,y+0.6,w-1.2,rh-1.1,1.8*u); g.fill(); x+=w; } }
  var cx=x1, ch=h*0.45;
  while(cx<x2){ var cw=(2.6+R()*1.8)*u; g.fillStyle=STONES[Math.floor(R()*STONES.length)]; rr(g,cx+0.4,base-h-ch+R()*1.2*u+1,cw-0.8,ch,1.2*u); g.fill(); cx+=cw; }
  g.restore();
  g.fillStyle='rgba(40,70,25,.22)'; g.fillRect(x1,base,x2-x1,2.5*u);
}
function stoneWallV(g,x,w,y1,y2,R){
  g.fillStyle='#5e594f'; g.fillRect(x,y1,w,y2-y1);
  var y=y1; while(y<y2){ var h=(4+R()*4)*u, half=R()<0.5;
    if(half){ g.fillStyle=STONES[Math.floor(R()*6)]; rr(g,x+0.6,y+0.5,w/2-1,h-1,1.5*u); g.fill(); g.fillStyle=STONES[Math.floor(R()*6)]; rr(g,x+w/2+0.4,y+0.5,w/2-1,h-1,1.5*u); g.fill(); }
    else { g.fillStyle=STONES[Math.floor(R()*6)]; rr(g,x+0.6,y+0.5,w-1.2,h-1,1.5*u); g.fill(); }
    y+=h; }
}
function buildWoods(){
  woods=[]; var R=rng(99), exitX=fx+4.5*tw;
  for(var row=0;row<2;row++){
    var x=-10+R()*10;
    while(x<W+10){ if(Math.abs(x-exitX)>tw*(row?0.55:0.75)) woods.push({x:x, y:fy-(row?wh*0.2:wh*1.2)+R()*3, s:u*(row?0.95:0.78)*(0.85+R()*0.3), p:R()*6, pal:TREE_PAL[row?Math.floor(R()*3):1]});
      x+=tw*(row?0.62:0.55)*(0.8+R()*0.4); }
  }
  woods.sort(function(a,b){return a.y-b.y;});
  if(!clouds.length) for(var i=0;i<4;i++) clouds.push({x:R()*W, y:avTop+10+R()*(fy-avTop)*0.25, s:0.7+R()*0.6, v:3+R()*4});
}
function drawCloud(g,x,y,s){ g.fillStyle='rgba(255,255,255,.85)'; ell(g,x,y,18*s,7*s); g.fill(); ell(g,x-9*s,y-3*s,9*s,7*s); g.fill(); ell(g,x+6*s,y-6*s,11*s,9*s); g.fill(); }

/* ================= guests ================= */
var SKIN=['#f1c9a5','#d9a47c','#a8714b','#f5d6bc'];
var groups=[
  {f:0.18, dir:1, v:13, members:[{shirt:'#d9534f',legs:'#3f4b63',skin:SKIN[0],hair:'#6b4224'},{child:1,off:-3,side:7,shirt:'#f2c14e',legs:'#3f4b63',skin:SKIN[0],hair:'#6b4224'}]},
  {f:0.55, dir:-1, v:10, members:[{side:-3.5,shirt:'#2a7f7a',legs:'#5a4a3a',skin:SKIN[1],hair:'#2e2620'},{side:3.5,off:1,shirt:'#8e6bb0',legs:'#3b3226',skin:SKIN[3],hair:'#c98b3c'}]},
  {f:0.8, dir:1, v:17, members:[{shirt:'#4f7f3a',legs:'#5a4a3a',skin:SKIN[2],hair:'#2e2620',pack:'#d9822b',stick:1,hat:'#c4533d'}]}
];
var idle=[{c:4,r:7,dx:-0.42,dy:0.28,p:{shirt:'#e8964f',legs:'#3f4b63',skin:SKIN[3],hair:'#8a5a33'}}];

/* ================= UI ================= */
var $=function(id){return document.getElementById(id);};
var buildsEl=$('builds'), btns={};
ORDER.forEach(function(k){
  var b=document.createElement('button'); b.className='b'; b.setAttribute('aria-label',TYPES[k].name);
  b.innerHTML='<canvas width="120" height="88"></canvas><div class="nm">'+TYPES[k].label+'</div><div class="pr">'+fmt(TYPES[k].cost)+'</div>';
  var g=b.querySelector('canvas').getContext('2d'); g.setTransform(2,0,0,2,0,0);
  var s=k==='reception'?0.98:1.05, by=k==='tent'?38:41; DRAW[k](g,30,by,s,0,{v:0});
  b.addEventListener('click',function(){ selectBuild(k); });
  buildsEl.appendChild(b); btns[k]=b;
});
function renderStars(){ var h=''; for(var i=1;i<=5;i++){ var fill=state.rep>=i?1:(state.rep>=i-0.5?0.5:0);
  h+='<svg width="17" height="17" viewBox="0 0 20 20"><defs><linearGradient id="sg'+i+'"><stop offset="'+(fill*100)+'%" stop-color="#e3a72f"/><stop offset="'+(fill*100)+'%" stop-color="#e6dcc4"/></linearGradient></defs><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6l-5.2 2.9 1.2-5.8-4.4-4 5.9-.7z" fill="url(#sg'+i+')" stroke="#c48a1e" stroke-width="1" stroke-linejoin="round"/></svg>'; }
  $('stars').innerHTML=h; }
function refreshUI(){
  $('moneyTxt').textContent=fmt(state.money);
  ORDER.forEach(function(k){ btns[k].classList.toggle('poor',TYPES[k].cost>state.money); btns[k].classList.toggle('sel',state.selected===k); });
  var hint=$('hint');
  if(state.selected){ hint.innerHTML='<span>Tap free grass to place your <b>'+TYPES[state.selected].name+'</b></span>'; $('cancel').style.display='block'; $('speed').style.display='none'; }
  else { hint.textContent='Pick something to build, then tap the grass.'; $('cancel').style.display='none'; $('speed').style.display='flex'; }
}
var toastT=0;
function toast(msg,kind){ var t=$('toast'); t.className='show '+(kind||'warn'); t.querySelector('.ti').textContent=kind==='ok'?'✓':(kind==='info'?'i':'!');
  $('toastTxt').innerHTML=msg; clearTimeout(toastT); toastT=setTimeout(function(){ t.className=t.className.replace('show',''); },2600); }
function selectBuild(k){
  if(state.selected===k){ state.selected=null; state.ghost=null; refreshUI(); return; }
  if(TYPES[k].cost>state.money){ toast('Not quite enough in the till – a <b>'+TYPES[k].name+'</b> costs '+fmt(TYPES[k].cost)+'. You have '+fmt(state.money)+'.'); return; }
  state.selected=k; state.ghost=null; refreshUI();
}
$('cancel').addEventListener('click',function(){ state.selected=null; state.ghost=null; refreshUI(); });
$('menu').addEventListener('click',function(){ toast('Save, load and restart will live here in the prototype.','info'); });
Array.prototype.forEach.call(document.querySelectorAll('#speed button'),function(b){ b.addEventListener('click',function(){
  state.speed=+b.getAttribute('data-s');
  Array.prototype.forEach.call(document.querySelectorAll('#speed button'),function(o){ o.classList.toggle('on',o===b); });
  $('paused').style.display=state.speed===0?'block':'none';
}); });

/* ================= placement ================= */
function occupant(c,r){
  var i; for(i=0;i<PATH.length;i++) if(PATH[i][0]===c&&PATH[i][1]===r) return 'path';
  for(i=0;i<state.buildings.length;i++){ var b=state.buildings[i]; if(b.c===c&&b.r===r) return b; }
  for(i=0;i<state.trees.length;i++) if(state.trees[i].c===c&&state.trees[i].r===r) return 'tree';
  for(i=0;i<state.decor.length;i++) if(state.decor[i].c===c&&state.decor[i].r===r) return 'campfire';
  return null;
}
function tileAt(x,y){ var c=Math.floor((x-fx)/tw), r=Math.floor((y-fy)/th); if(c<0||r<0||c>=COLS||r>=ROWS) return null; return {c:c,r:r}; }
function check(c,r){ var o=occupant(c,r);
  if(o==='path') return 'Let’s keep the footpath clear for walkers.';
  if(o==='tree') return 'That old tree stays – try a clear patch of grass.';
  if(o==='campfire') return 'The campfire spot is taken – guests love it there!';
  if(o) return 'That spot’s already got a '+TYPES[o.type].name+' on it.';
  return null; }
var floaters=[];
function place(c,r){
  var k=state.selected, why=check(c,r);
  if(why){ toast(why); return false; }
  if(TYPES[k].cost>state.money){ toast('Not quite enough in the till – a <b>'+TYPES[k].name+'</b> costs '+fmt(TYPES[k].cost)+'.'); return false; }
  state.money-=TYPES[k].cost;
  state.buildings.push({type:k,c:c,r:r,v:state.buildings.length%3,born:now});
  var p=tileCenter(c,r); floaters.push({x:p[0],y:p[1]-th*0.6,txt:'−'+fmt(TYPES[k].cost),t0:now});
  var m=$('money'); m.classList.add('flash'); setTimeout(function(){m.classList.remove('flash');},450);
  toast('<b>'+TYPES[k].name+'</b> built! '+TYPES[k].info,'ok');
  state.selected=null; state.ghost=null; refreshUI(); return true;
}
function evPos(e){ return [e.clientX,e.clientY]; }
var down=null;
cv.addEventListener('pointerdown',function(e){ var p=evPos(e), t=tileAt(p[0],p[1]); down=t;
  if(state.selected&&t){ state.ghost={c:t.c,r:t.r,ok:!check(t.c,t.r)}; } });
cv.addEventListener('pointermove',function(e){ if(!state.selected) return; var p=evPos(e), t=tileAt(p[0],p[1]);
  if(e.pointerType==='mouse'||down){ state.ghost=t?{c:t.c,r:t.r,ok:!check(t.c,t.r)}:null; } });
cv.addEventListener('pointerup',function(e){ var p=evPos(e), t=tileAt(p[0],p[1]); down=null;
  if(!t) return;
  if(state.selected){ place(t.c,t.r); return; }
  var o=occupant(t.c,t.r);
  if(o&&o.type) toast('<b>'+TYPES[o.type].name+'</b> – '+TYPES[o.type].info,'info');
  else if(o==='path') toast('The footpath – guests stroll here between pitches and the woods.','info');
});

/* ================= main loop ================= */
var now=0, last=0;
function frame(ts){
  ts/=1000; var dt=Math.min(0.05,ts-(last||ts)); last=ts; now=ts; var sdt=dt*state.speed;
  // simulate time + guests
  state.minutes+=sdt*10; if(state.minutes>=22*60){ state.minutes=8*60; state.day++; }
  var mm=Math.floor(state.minutes/10)*10; $('clock').textContent='Day '+state.day+' · '+('0'+Math.floor(mm/60)).slice(-2)+':'+('0'+mm%60).slice(-2);
  groups.forEach(function(gp){ gp.f+=gp.dir*gp.v*u*sdt/pathLen; if(gp.f>inner[1]){gp.f=inner[1];gp.dir=-1;} if(gp.f<inner[0]){gp.f=inner[0];gp.dir=1;}
    gp.members.forEach(function(m){ m.moving=state.speed>0; if(m.moving) m.ph=(m.ph||0)+sdt*gp.v*0.7; m.dir=gp.dir; }); });
  clouds.forEach(function(c){ c.x+=c.v*dt; if(c.x>W+40) c.x=-40; });

  var g=ctx; g.setTransform(dpr,0,0,dpr,0,0);
  g.drawImage(L.sky.c,0,0,W,H);
  clouds.forEach(function(c){ drawCloud(g,c.x,c.y,c.s); });
  g.drawImage(L.hills.c,0,0,W,H);
  woods.forEach(function(w){ drawTree(g,w.x,w.y,w.s,now,w.p,w.pal); });
  g.drawImage(L.field.c,0,0,W,H);

  // build-mode grid hints
  if(state.selected){ g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=1; g.setLineDash([3,3]);
    for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) if(!occupant(c,r)){ rr(g,fx+c*tw+3,fy+r*th+3,tw-6,th-6,6); g.stroke(); } g.setLineDash([]); }
  if(state.ghost){ var gh=state.ghost; g.fillStyle=gh.ok?'rgba(88,190,92,.5)':'rgba(214,72,60,.5)'; rr(g,fx+gh.c*tw+2,fy+gh.r*th+2,tw-4,th-4,7); g.fill();
    g.strokeStyle=gh.ok?'#2e7d32':'#b23b2e'; g.lineWidth=2; g.stroke(); }

  // depth-sorted objects
  var objs=[];
  state.buildings.forEach(function(b){ var p=tileCenter(b.c,b.r); objs.push({y:p[1]+th*0.32,f:function(){
    var by=p[1]+th*0.32, sc=u*BS; if(b.born){ var k=Math.min(1,(now-b.born)/0.35); sc=u*BS*(0.6+0.4*(1-Math.pow(1-k,3))+Math.sin(k*Math.PI)*0.08); }
    DRAW[b.type](g,p[0],by,sc,now,b); }}); });
  state.trees.forEach(function(t){ var p=tileCenter(t.c,t.r); objs.push({y:p[1]+th*0.3,f:function(){ drawTree(g,p[0],p[1]+th*0.3,u*t.s*1.15,now,t.p,TREE_PAL[2]); }}); });
  state.decor.forEach(function(d){ var p=tileCenter(d.c,d.r); objs.push({y:p[1]+th*0.3,f:function(){ drawCampfire(g,p[0]+2*u,p[1]+th*0.32,u*1.15,now); }}); });
  groups.forEach(function(gp){ gp.members.forEach(function(m){ var q=pathAt(Math.max(0,Math.min(1,gp.f+(m.off||0)*gp.dir*u/pathLen))); var x=q[0]+(m.side||0)*u, y=q[1]+2*u+(m.child?1.5*u:0);
    objs.push({y:y,f:function(){ drawPerson(g,x,y,u*PS,m,now); }}); }); });
  idle.forEach(function(d){ var p=tileCenter(d.c,d.r), x=p[0]+d.dx*tw, y=p[1]+d.dy*th+th*0.18;
    objs.push({y:y,f:function(){ d.p.moving=false; drawPerson(g,x,y-Math.abs(Math.sin(now*2))*0.6*u,u*PS,d.p,now); }}); });
  objs.sort(function(a,b){return a.y-b.y;}).forEach(function(o){ o.f(); });

  if(state.ghost){ var gp2=tileCenter(state.ghost.c,state.ghost.r); g.globalAlpha=0.72; DRAW[state.selected](g,gp2[0],gp2[1]+th*0.32,u*BS,0,{v:0}); g.globalAlpha=1; }
  g.drawImage(L.front.c,0,0,W,H);

  floaters=floaters.filter(function(f){ var k=(now-f.t0)/1.4; if(k>1) return false;
    g.globalAlpha=1-k*k; g.font='800 '+Math.round(16*u+2)+'px ui-rounded,Nunito,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.lineWidth=4; g.strokeStyle='#fffaf0'; g.strokeText(f.txt,f.x,f.y-k*26); g.fillStyle='#c4533d'; g.fillText(f.txt,f.x,f.y-k*26); g.globalAlpha=1; return true; });
  requestAnimationFrame(frame);
}

/* test/automation hook (not part of gameplay) */
window.__cet={groups:groups,inner:inner,state:state, tileScreen:function(c,r){ return tileCenter(c,r); }, check:check};

renderStars(); refreshUI(); layout();
window.addEventListener('resize',layout);
requestAnimationFrame(frame);
})();
</script>
</body>
